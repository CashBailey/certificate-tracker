[project]
name = "laredo-api"
version = "0.1.0"
description = "City of Laredo Certificate Management System API"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "unit: Unit tests (fast, no I/O)",
    "integration: Integration tests (database, storage)",
    "api: API endpoint tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/alembic/*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-ignore = [
    "E402",  # module level import not at top — intentional for constants/logger setup
    "E711",  # comparison to None — required for SQLAlchemy ORM filters
    "E712",  # comparison to True/False — required for SQLAlchemy ORM filters
]
