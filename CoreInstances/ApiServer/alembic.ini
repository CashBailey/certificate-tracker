# Alembic configuration for City of Laredo Certificate Management System

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for timestamps
timezone = UTC

# Max width of SQL statements to output
truncate_slug_length = 40

# Prepend sys.path with the application path
prepend_sys_path = .

# Version path separator (for multiple version locations)
version_path_separator = os

# Naming convention for constraints
[alembic:naming_convention]
ix = 'ix_%(column_0_label)s'
uq = 'uq_%(table_name)s_%(column_0_name)s'
ck = 'ck_%(table_name)s_%(constraint_name)s'
fk = 'fk_%(table_name)s_%(column_0_name)s_%(referred_table_name)s'
pk = 'pk_%(table_name)s'

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
