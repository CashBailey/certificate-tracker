# PostgreSQL Client Authentication Configuration
#
# TYPE  DATABASE  USER  ADDRESS         METHOD
#
# Local socket connections (used by postgres management tools inside container)
local   all       all                   scram-sha-256
# IPv4 loopback — plain password for pgAdmin / psql debugging from localhost
host    all       all   127.0.0.1/32    scram-sha-256
# Roundcube webmail — uses SSL but does not support mTLS client certificates
hostssl roundcube laredo 0.0.0.0/0      scram-sha-256
# All other TCP connections MUST use TLS and present a valid client certificate
hostssl all       all   0.0.0.0/0       scram-sha-256  clientcert=verify-ca
